<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />

    <title>Aditya Jain — Full-Stack Software Engineer</title>
    <meta
      name="description"
      content="Full-Stack Software Engineer building scalable SaaS platforms, automation systems, integrations and AI-powered applications."
    />
    <meta name="author" content="Aditya Jain" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jain04.github.io/portfolio/" />

    <!--
      og:image must be an absolute URL and a raster format — LinkedIn, Slack and
      X will not fetch a relative path and will not render an SVG, and this card
      is the first thing anyone sees when the site is shared. Regenerate the
      image with `npm run og` after editing scripts/og.html.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jain04.github.io/portfolio/" />
    <meta property="og:site_name" content="Aditya Jain" />
    <meta property="og:title" content="Aditya Jain — Full-Stack Software Engineer" />
    <meta
      property="og:description"
      content="Full-Stack Software Engineer building scalable SaaS platforms, automation systems, integrations and AI-powered applications."
    />
    <meta property="og:image" content="https://jain04.github.io/portfolio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Aditya Jain — I build software that solves real business problems."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aditya Jain — Full-Stack Software Engineer" />
    <meta
      name="twitter:description"
      content="Full-Stack Software Engineer building scalable SaaS platforms, automation systems, integrations and AI-powered applications."
    />
    <meta name="twitter:image" content="https://jain04.github.io/portfolio/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
