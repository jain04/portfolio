name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deployment from the Actions tab without a new commit.
  workflow_dispatch:

# Least privilege: read the repo, mint an OIDC token, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. `cancel-in-progress` drops superseded runs so a
# rapid series of pushes ends with the newest commit live.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Lockfile-exact install; fails loudly if package.json and the lockfile
        # have drifted, rather than silently resolving something new.
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
